[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nxus-agent-harness"
version = "0.1.0"
description = "Harness agentique local-first, fail-closed et sans dépendance réseau par défaut"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
nxus-harness = "nxus_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
